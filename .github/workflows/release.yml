name: release

# 触发方式：推送形如 v1.2.3 的 tag，或在 Actions 页面手动触发。
# 产物：
#   - hopdrop-cli-*           各平台命令行可执行文件（含压缩包）
#   - HopDrop-macos-*.dmg     macOS 桌面端安装包
#   - HopDrop-windows-*.zip   Windows 桌面端 .exe
#   - HopDrop-*.apk           Android 安装包
#   - hopdrop.aar             Android 绑定库
#   - HopDrop.xcframework     iOS 绑定框架（三端发布的必需产物）
# 所有产物既作为 workflow artifact 上传，tag 触发时也附加到 GitHub Release。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.26.0'
  FYNE_VERSION: 'latest'
  GOMOBILE_VERSION: 'v0.0.0-20260821190718-4776eadac327'

jobs:
  # ---------------------------------------------------------------------------
  # 1) CLI：交叉编译到 5 个平台，纯 Go、无需 CGO。
  # ---------------------------------------------------------------------------
  cli:
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          out="hopdrop"
          [ "$GOOS" = "windows" ] && out="hopdrop.exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/$out" ./cmd/hopdrop
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip "hopdrop-cli-${GOOS}-${GOARCH}.zip" "$out"
          else
            tar czf "hopdrop-cli-${GOOS}-${GOARCH}.tar.gz" "$out"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hopdrop-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/hopdrop-cli-*

  # ---------------------------------------------------------------------------
  # 2) macOS 桌面端：Fyne 原生编译（CGO + OpenGL），打成 .app 再封成 .dmg。
  # ---------------------------------------------------------------------------
  desktop-macos:
    name: Desktop macOS (${{ matrix.goarch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install fyne tool
        run: go install fyne.io/tools/cmd/fyne@${{ env.FYNE_VERSION }}
      - name: Package .app
        working-directory: ./cmd/hopdrop-gui
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          "$(go env GOPATH)/bin/fyne" package --os darwin
          # fyne 在当前目录产出 HopDrop.app
          test -d HopDrop.app
      - name: Build .dmg
        working-directory: ./cmd/hopdrop-gui
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dmgroot
          cp -R HopDrop.app dmgroot/
          ln -s /Applications dmgroot/Applications
          mkdir -p "$GITHUB_WORKSPACE/dist"
          hdiutil create -volname "HopDrop" -srcfolder dmgroot -ov -format UDZO \
            "$GITHUB_WORKSPACE/dist/HopDrop-macos-${GOARCH}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: HopDrop-macos-${{ matrix.goarch }}
          path: dist/HopDrop-macos-*.dmg

  # ---------------------------------------------------------------------------
  # 3) Windows 桌面端：在 Windows runner 上用 fyne 打成 .exe（含图标资源）。
  # ---------------------------------------------------------------------------
  desktop-windows:
    name: Desktop Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install fyne tool
        run: go install fyne.io/tools/cmd/fyne@${{ env.FYNE_VERSION }}
      - name: Package .exe
        shell: bash
        working-directory: ./cmd/hopdrop-gui
        env:
          CGO_ENABLED: '1'
        run: |
          "$(go env GOPATH)/bin/fyne" package --os windows
          # 产出 HopDrop.exe
          test -f HopDrop.exe
          mkdir -p "$GITHUB_WORKSPACE/dist"
          7z a "$GITHUB_WORKSPACE/dist/HopDrop-windows-amd64.zip" HopDrop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: HopDrop-windows-amd64
          path: dist/HopDrop-windows-amd64.zip

  # ---------------------------------------------------------------------------
  # 4) Android：gomobile 产出 .aar，Gradle 把参考 App 打成 APK。
  # ---------------------------------------------------------------------------
  android:
    name: Android (.aar + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${{ env.GOMOBILE_VERSION }}
          go install golang.org/x/mobile/cmd/gobind@${{ env.GOMOBILE_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build .aar
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.0.12077973"
          echo "Using NDK at: $ANDROID_NDK_HOME"
          gomobile init
          mkdir -p dist mobile/android/app/libs
          gomobile bind -target=android -androidapi 21 -javapkg com.hopdrop \
            -o mobile/android/app/libs/hopdrop.aar ./mobile
          cp mobile/android/app/libs/hopdrop.aar dist/hopdrop.aar
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: ./mobile/android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          find mobile/android -name '*.apk' -path '*release*' -exec cp {} dist/HopDrop-release.apk \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: HopDrop-android
          path: |
            dist/hopdrop.aar
            dist/*.apk

  # ---------------------------------------------------------------------------
  # 5) iOS：gomobile 产出 .xcframework；失败会阻塞三端版本发布。
  # ---------------------------------------------------------------------------
  ios:
    name: iOS (.xcframework)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${{ env.GOMOBILE_VERSION }}
          go install golang.org/x/mobile/cmd/gobind@${{ env.GOMOBILE_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build .xcframework
        run: |
          gomobile init
          mkdir -p dist
          gomobile bind -target=ios -o dist/HopDrop.xcframework ./mobile
          (cd dist && zip -ry HopDrop-ios-xcframework.zip HopDrop.xcframework)
      - uses: actions/upload-artifact@v4
        with:
          name: HopDrop-ios
          path: dist/HopDrop-ios-xcframework.zip

  # ---------------------------------------------------------------------------
  # 6) 汇总：tag 触发时把全部产物挂到 GitHub Release。
  #    三端产物全部成功后才发布。
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [cli, desktop-macos, desktop-windows, android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.aar' \
               -o -name '*.apk' -o -name '*.dmg' -o -name '*.ipa' \) \
            -exec cp {} release/ \;
          ls -la release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
